<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Доступ ограничен</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #070709;
            color: #fff;
            min-height: 100vh;
            padding: 80px 20px 30px 20px;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
        }

        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(232, 72, 72, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(60, 120, 220, 0.06) 0%, transparent 40%);
            pointer-events: none;
            z-index: -1;
            animation: bgMove 25s ease-in-out infinite alternate;
        }

        @keyframes bgMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(30px, 20px); }
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .header {
            text-align: center;
            animation: fadeIn 1s ease-out;
        }

        .header-badge {
            display: inline-block;
            padding: 5px 14px;
            background: rgba(232, 72, 72, 0.1);
            border: 1px solid rgba(232, 72, 72, 0.2);
            border-radius: 20px;
            color: #e84848;
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 36px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 6px;
            color: #fff;
            margin-bottom: 12px;
            text-shadow: 0 0 30px rgba(232, 72, 72, 0.2);
        }

        .header p {
            font-size: 12px;
            color: rgba(255,255,255,0.35);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 25px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            line-height: 1.6;
        }

        .header .line {
            width: 80px;
            height: 2px;
            background: linear-gradient(90deg, 
                transparent 0%, 
                #e84848 50%, 
                transparent 100%
            );
            margin: 0 auto;
            box-shadow: 0 0 15px rgba(232, 72, 72, 0.5);
            border-radius: 2px;
        }

        .code {
            margin-top: 40px;
            font-family: monospace;
            font-size: 10px;
            color: rgba(232, 72, 72, 0.4);
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        .bg-overlay {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 50% 0%, rgba(30, 30, 40, 0.3) 0%, transparent 50%);
            pointer-events: none;
            z-index: -1;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="bg-overlay"></div>
    <div class="container">
        <header class="header">
            <div class="header-badge">Terminal v2.0</div>
            <h1>Доступ заблокирован</h1>
            <p>Ваш IP-адрес находится в списке блокировки. Вход в «Край Руин» запрещен»</p>
            <div class="line"></div>
            <div class="code">Error Code: ACCESS_DENIED_HWID_IP</div>
        </header>
    </div>
</body>
</html>
